# Hokulea
# 
# Celo fork based on Layr-Labs hokulea-client/v1.2.2.
# It keeps EigenDADataSource generic over DataAvailabilityProvider for Celo's custom source and 
# aligns reth with kona-client/v1.7.0-rc.1.
# 
# hokulea-proof's KZG batch-verifier backend is selected via feature:
# `sp1-bn` swaps the arkworks verifier for one built on the sp1 `bn` precompile,
# cutting KZG batch verification ~74% on the zkVM proving path.
hokulea-eigenda = { git = "https://github.com/celo-org/hokulea", rev = "6ec2be5d9c3e18734f087b58177426ea3d03fd51", default-features = false }
