name: Reth fork tests

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/reth-fork-tests.yml
  push:
    branches:
      - main
      - "celo/reth-v[0-9]*"
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/reth-fork-tests.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OPTIMISM_FORK_REACHABILITY_TAG: celo-kona/op-reth-v2.4-sparse-trie-v2
  RETH_FORK_REACHABILITY_TAG: celo-kona/reth-v2.4-tracing-context-v1

jobs:
  scoped-tests:
    name: reth fork scoped tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout celo-kona
        uses: actions/checkout@v7

      - name: Resolve pinned Optimism fork revision
        id: optimism-rev
        shell: bash
        run: |
          set -euo pipefail
          revs="$(
            sed -n \
              's/.*git = "https:\/\/github.com\/celo-org\/optimism".*rev = "\([0-9a-f]\{40\}\)".*/\1/p' \
              Cargo.toml |
              sort -u
          )"
          count="$(printf '%s\n' "$revs" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$count" != "1" ]]; then
            echo "expected one celo-org/optimism revision, found $count" >&2
            exit 1
          fi
          echo "rev=$revs" >> "$GITHUB_OUTPUT"

      - name: Verify pinned Optimism fork tag
        env:
          OPTIMISM_FORK_REV: ${{ steps.optimism-rev.outputs.rev }}
        shell: bash
        run: |
          set -euo pipefail
          tag_rev="$(
            git ls-remote \
              https://github.com/celo-org/optimism.git \
              "refs/tags/${OPTIMISM_FORK_REACHABILITY_TAG}" |
              awk '{ print $1 }'
          )"
          if [[ "$tag_rev" != "$OPTIMISM_FORK_REV" ]]; then
            echo \
              "expected ${OPTIMISM_FORK_REACHABILITY_TAG} to resolve to ${OPTIMISM_FORK_REV}, got ${tag_rev:-missing}" \
              >&2
            exit 1
          fi

      - name: Resolve pinned reth fork revision
        id: reth-rev
        shell: bash
        run: |
          set -euo pipefail
          revs="$(
            sed -n \
              's/.*git = "https:\/\/github.com\/celo-org\/reth".*rev = "\([0-9a-f]\{40\}\)".*/\1/p' \
              Cargo.toml |
              sort -u
          )"
          count="$(printf '%s\n' "$revs" | sed '/^$/d' | wc -l | tr -d ' ')"
          if [[ "$count" != "1" ]]; then
            echo "expected one celo-org/reth revision, found $count" >&2
            exit 1
          fi
          echo "rev=$revs" >> "$GITHUB_OUTPUT"

      - name: Verify pinned reth fork tag
        env:
          RETH_FORK_REV: ${{ steps.reth-rev.outputs.rev }}
        shell: bash
        run: |
          set -euo pipefail
          tag_rev="$(
            git ls-remote \
              https://github.com/celo-org/reth.git \
              "refs/tags/${RETH_FORK_REACHABILITY_TAG}" |
              awk '{ print $1 }'
          )"
          if [[ "$tag_rev" != "$RETH_FORK_REV" ]]; then
            echo \
              "expected ${RETH_FORK_REACHABILITY_TAG} to resolve to ${RETH_FORK_REV}, got ${tag_rev:-missing}" \
              >&2
            exit 1
          fi

      - name: Checkout pinned reth fork
        uses: actions/checkout@v7
        with:
          repository: celo-org/reth
          ref: ${{ steps.reth-rev.outputs.rev }}
          path: reth-fork
          fetch-depth: 1
          persist-credentials: false

      - uses: rui314/setup-mold@v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: reth-fork -> target
          cache-on-failure: true

      - name: Run scoped fork tests
        working-directory: reth-fork
        run: |
          cargo nextest run \
            --locked \
            --no-fail-fast \
            -p reth-rpc \
            -p reth-rpc-eth-api \
            -p reth-provider
