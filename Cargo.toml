# This temporary reth fork carries Celo's block-context capture/seed hook and
# its fresh-call integrations (`debug_traceCall` with a tx index,
# `debug_traceCallMany`, `trace_callMany`, and `eth_callMany`), including the
# call-many bundle-boundary, override, and empty-bundle plumbing required to
# preserve capture/seed semantics. CeloEVM carries block-scoped state (the
# per-block fee-currency exchange rates) initialised from the first state the
# EVM observes, so a call simulated at a mid-block position would otherwise
# re-initialise it from mid-block state.
#
# The fork previously also carried a Celo single-EVM transaction replay for
# tracing RPCs, proposed upstream as paradigmxyz/reth#26523 and closed
# unmerged; upstream landed an equivalent with a different factoring in
# #26614. That commit is cherry-picked onto the base here and Celo's version
# is gone, so the fork's delta over upstream is now exactly the Celo-only
# part. Drop the cherry-pick once op-rs/reth's pinned revision includes
# #26614 on its own.
#
# The fork also carries one build fix: op-rs's `create_access_list_with`
# builds its own `State` rather than going through `spawn_with_state_at_block`
# and does not compile against #26614's narrowed `Trace::inspect`.
#
# Do not remove this patch merely because #26614 landed; it is still needed
# until the capture/seed path is upstream or no longer required by Celo.
# The patch must cover every reth crate in the graph so the op-reth git deps
# unify with the fork. On a rev bump, regenerate this list from the reth
# packages Cargo.lock resolves from this git source.
# Keep the pinned SHA reachable via the
# `celo-kona/reth-v2.4-tracing-context-v1` tag in celo-org/reth, and protect
# that tag from updates and deletion — the fork branch is not a durable
# anchor. The scoped fork-test workflow verifies that the tag still resolves
# to this exact rev.
