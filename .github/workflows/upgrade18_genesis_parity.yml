# Preserve the existing job identity while replacing the retired state-override gate.
# Runtime migration/parity tests run in the regular Rust CI `test` job on every PR.
name: CGTv2 upgrade fixture integrity

on:
  push:
    branches: [ main ]
    paths:
      - crates/celo-alloy/consensus/testdata/cgt_v2/**
      - crates/celo-alloy/consensus/src/cgt_v2*.rs
      - crates/alloy-celo-evm/src/block/**
      - scripts/cgtv2/**
      - .github/workflows/upgrade18_genesis_parity.yml
  pull_request:
    paths:
      - crates/celo-alloy/consensus/testdata/cgt_v2/**
      - crates/celo-alloy/consensus/src/cgt_v2*.rs
      - crates/alloy-celo-evm/src/block/**
      - scripts/cgtv2/**
      - .github/workflows/upgrade18_genesis_parity.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  genesis-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - name: Verify frozen NUT, gas and prestate provenance
        run: python3 scripts/cgtv2/verify_fixture.py
