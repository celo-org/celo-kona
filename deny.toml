[graph]
targets = []
all-features = false
no-default-features = false

[output]
feature-depth = 1

[advisories]
ignore = [
    # paste crate is no longer maintained.
    "RUSTSEC-2024-0436",
    # https://rustsec.org/advisories/RUSTSEC-2025-0141 bincode is unmaintained, need to transition all deps to wincode first
    "RUSTSEC-2025-0141",
    # https://rustsec.org/advisories/RUSTSEC-2026-0173 proc-macro-error2 is unmaintained.
    # Build-time only: pulled in by alloy-sol-macro (the sol! proc-macro), so it never ships in
    # the runtime binary. Unmaintained (not a vulnerability) and no safe upgrade exists; removing
    # it requires alloy-sol-macro to drop the dep upstream.
    "RUSTSEC-2026-0173",
    # https://rustsec.org/advisories/RUSTSEC-2026-0247 bitmaps is unmaintained.
    # Transitive only: reth-transaction-pool -> imbl -> imbl-sized-chunks -> bitmaps. Nothing in
    # this workspace names it, all versions are affected, and it is unmaintained rather than a
    # vulnerability, so clearing it needs reth or imbl to drop the dep upstream.
    "RUSTSEC-2026-0247",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unlicense",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "0BSD",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = [
    # CC0 is a permissive license but somewhat unclear status for source code
    # so we prefer to not have dependencies using it
    # https://tldrlegal.com/license/creative-commons-cc0-1.0-universal
    { allow = ["CC0-1.0"], name = "secp256k1" },
    { allow = ["CC0-1.0"], name = "aurora-engine-modexp" },
    { allow = ["CC0-1.0"], name = "secp256k1-sys" },
    { allow = ["CC0-1.0"], name = "tiny-keccak" },
    { allow = ["CC0-1.0"], name = "notify" },
]

[[licenses.clarify]]
name = "ring"
expression = "LicenseRef-ring"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[licenses.private]
ignore = true
ignore-sources = ["https://github.com/celo-org/hokulea"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "https://github.com/sp1-patches/bn",
    # kona and op-reth crates are pulled from the optimism monorepo via the
    # kona-client/v1.7.0-rc.1 tag.
    "https://github.com/ethereum-optimism/optimism",
    # discv5 is pulled in transitively by reth-discv5 from a sigp git rev;
    # reth pins it directly rather than a crates.io release.
    "https://github.com/sigp/discv5",
]

# celo-org repos are as trusted as this one; `allow-git` names third-party sources only.
[sources.allow-org]
github = ["celo-org"]
gitlab = []
bitbucket = []
