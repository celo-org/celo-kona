[patch.crates-io]
# This fork is the exact kona-client/v1.7.0-rc.1 pin plus the payload-builder
# sparse-trie handle, bounded wait, root-source metrics, canonical-root e2e,
# shared execution cache, and its cache-wiring regression assertion. Keep the
# pinned SHA reachable via the `celo-kona/op-reth-v2.4-sparse-trie-v1` tag in
# celo-org/optimism. The fork-test workflow verifies the tag against this rev.
# Pin the registry versions of op-alloy / alloy-op-* / op-revm to the same fork
# so all Optimism packages resolve from one source.
op-alloy-consensus = { git = "https://github.com/celo-org/optimism", rev = "e31a64b916c4e13dd7db8a39a68c4d9a19eeb2e6" }
op-alloy-rpc-types-engine = { git = "https://github.com/celo-org/optimism", rev = "e31a64b916c4e13dd7db8a39a68c4d9a19eeb2e6" }
op-alloy-rpc-types = { git = "https://github.com/celo-org/optimism", rev = "e31a64b916c4e13dd7db8a39a68c4d9a19eeb2e6" }
op-alloy-network = { git = "https://github.com/celo-org/optimism", rev = "e31a64b916c4e13dd7db8a39a68c4d9a19eeb2e6" }
alloy-op-hardforks = { git = "https://github.com/celo-org/optimism", rev = "e31a64b916c4e13dd7db8a39a68c4d9a19eeb2e6" }
alloy-op-evm = { git = "https://github.com/celo-org/optimism", rev = "e31a64b916c4e13dd7db8a39a68c4d9a19eeb2e6" }
op-revm = { git = "https://github.com/celo-org/optimism", rev = "e31a64b916c4e13dd7db8a39a68c4d9a19eeb2e6" }

# Redirect packages requested through the upstream Optimism git source to the
# same fork revision without duplicating their workspace dependency entries.
[patch."https://github.com/ethereum-optimism/optimism"]
kona-cli = { git = "https://github.com/celo-org/optimism", rev = "e31a64b916c4e13dd7db8a39a68c4d9a19eeb2e6" }
