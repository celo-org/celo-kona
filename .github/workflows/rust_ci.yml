name: Rust CI

on:
  push:
    tags:
      - celo/v[0-9]*
    branches: [ main ]
  merge_group:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  # CI builds don't need debuginfo; dropping it shrinks link output and the
  # rust-cache entries that compete for the repo's 10 GB cache quota.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  cargo-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: test
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          components: rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
          fallback: none
      - name: cargo test
        run: just test

  # The trybuild compile-fail guard for `celo_revm::units` (see
  # `crates/celo-revm/tests/units_compile_fail.rs`) recompiles its dep tree
  # once per UI fixture in a trybuild-managed sub-target. It lives in its own
  # job so a from-scratch fixture compile can't eat the main `test` job's
  # budget. It runs on PRs: hosting the fixture in `celo-revm` rather than
  # `celo-reth` keeps that sub-compile small, and a main-only guard cannot
  # block the change that breaks it.
  trybuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: trybuild
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          components: rustfmt
          # A hit saves ~3 min on a job off the critical path; not worth ~2 GB
          # of the repo's 10 GB cache quota.
          save-cache: false
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
          fallback: none
      - name: cargo test (trybuild)
        run: just test-trybuild

  cargo-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        target: [ "native" ]
    name: lint-${{ matrix.target }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          channel: stable
          components: clippy
          prefix-key: ${{ matrix.target }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: fmt + lint
        run: just lint-${{ matrix.target }}

  cargo-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        target: [ "native" ]
    name: build-${{ matrix.target }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      # The full-workspace debug build plus the restored rust-cache exceeds
      # the ~14 GB free on standard runners. Reclaim ~25 GB of preinstalled
      # runner bloat first (same pattern as upstream kona; apt-installed
      # large packages stay because purging them is slow).
      - name: Free disk space (Ubuntu)
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          large-packages: false
      - uses: ./.github/actions/setup
        with:
          prefix-key: ${{ matrix.target }}
      - name: build
        run: just build-${{ matrix.target }}
  cargo-udeps:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: check-udeps
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          # This job takes 11-13 min with or without a cache hit, so its entry
          # is not worth a slot in the repo's 10 GB cache quota.
          save-cache: false
      # Pin the nightly that cargo-udeps runs under. The floating `nightly`
      # channel rolled to a 2026-05-18 build that segfaults cargo-udeps during
      # dependency resolution. Bump this date once a newer nightly is verified.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-05-17
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest@0.9.148
          fallback: none
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-udeps@0.1.61
          fallback: none
      - name: cargo udeps
        run: just check-udeps
        env:
          CELO_UDEPS_TOOLCHAIN: nightly-2026-05-17
  cargo-hack:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
          fallback: none
      - name: cargo hack
        run: just hack

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    name: e2e-tests
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          prefix-key: e2e
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1.9.1
        with:
          version: v1.8.3
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: e2e_test/js-tests/package-lock.json
      - name: Run e2e tests
        run: e2e_test/run_all_tests.sh
      - name: Upload celo-reth log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: celo-reth-log
          path: |
            e2e_test/celo-reth.log
            e2e_test/celo-reth-golden.log
          if-no-files-found: ignore

  check-no-std:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # `rust-toolchain.toml` pins the workspace to 1.95, so cargo auto-switches
      # to that channel regardless of which toolchain is installed here. Install
      # 1.95 explicitly *and* add the riscv32imac-unknown-none-elf target for
      # it — otherwise adding the target against `stable` leaves 1.95 without
      # a sysroot for the target and every cross build fails with
      # `error[E0463]: can't find crate for 'core'`.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.95"
          target: riscv32imac-unknown-none-elf
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack@0.6.45
          fallback: none
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # A miss costs ~6 min off the critical path; keep the quota for the
          # slow jobs.
          save-if: false
      - name: check
        run: ./.github/scripts/check_no_std.sh

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Keep in sync with `rust-toolchain.toml`. The toolchain file overrides
      # whatever the action installs, so a mismatch just makes rustup download
      # a second toolchain before running cargo-deny.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.95"
